<div class="container p-4">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-6">
      <h1 class="mb-4">
        <i class="fas fa-newspaper me-2"></i>
        Лента новостей
      </h1>

      <button (click)="logout()" class="btn btn-outline-danger me-1">
        <i class="fas fa-sign-out-alt me-1"></i>
        Выйти
      </button>

      <button (click)="navigateProfile()" class="btn btn-outline-secondary">
        <i class="fas fa-user me-1"></i>
        Профиль
      </button>

      @if (isLoading) {
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Загрузка...</span>
          </div>
          <p class="mt-2">Загрузка новостей...</p>
        </div>
      } @else {
        @for (post of posts; track $index) {
          @if (getPostAuthor(post)?.status !== 'blocked') {
            <app-post-card [post]="post" [author]="getPostAuthor(post)" (like)="onLike(post.id)">
            </app-post-card>
          }
        }

        <div class="text-center py-5">
          @if (posts.length === 0) {
            <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
            <p class="text-muted">Новостей нет</p>
          }
          <button (click)="createNewPost()" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>
            Создать пост
          </button>
        </div>
      }
    </div>
  </div>
</div>
