<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card">
        <div class="card-header">
          <h4 class="mb-0">
            <i class="fas fa-plus me-2"></i>
            Создать новость
          </h4>
        </div>
        
        <div class="card-body">
          <form #postForm="ngForm" (ngSubmit)="onSubmit(postForm)" class="post-form">
            <div class="mb-3">
              <textarea 
                id="content" 
                name="content" 
                class="form-control" 
                rows="4"
                placeholder="Описание"
                ngModel
                required
                maxlength="500">
              </textarea>
            </div>

            <div class="mb-3">
              <label for="photo" class="form-label">Фото (необязательно)</label>
              <input 
                type="text" 
                id="photo" 
                name="photo" 
                class="form-control"
                placeholder="Название файла (my-photo.jpg)"
                ngModel>
              <div class="form-text">Файл должен быть в папке photos</div>
            </div>

            <div class="d-flex gap-2">
              <button 
                type="submit" 
                class="btn btn-primary"
                [disabled]="!postForm.valid">
                <i class="fas fa-paper-plane"></i>
              </button>
              
              <button 
                type="button" 
                class="btn btn-outline-secondary"
                (click)="cancel()">
                <i class="fas fa-times me-2"></i>
                Отмена
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
