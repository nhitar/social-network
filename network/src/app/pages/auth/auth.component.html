<div class="auth-container">
  <div class="auth-tabs">
    <button (click)="switchToLogin()" [class.active]="isLoginMode">Вход</button>
    <button (click)="switchToRegister()" [class.active]="!isLoginMode">Регистрация</button>
  </div>

  <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" *ngIf="isLoginMode" class="auth-form">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" ngModel required email>
    </div>

    <div class="form-group">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" ngModel required>
    </div>
    
    <button type="submit" [disabled]="!loginForm.valid" class="btn-primary">
      Войти
    </button>
  </form>

  <form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)" *ngIf="!isLoginMode" class="auth-form">
    <div class="form-group">
      <label for="name">Имя</label>
      <input type="text" id="name" name="name" ngModel required>
    </div>
    
    <div class="form-group">
      <label for="surname">Фамилия</label>
      <input type="text" id="surname" name="surname" ngModel required>
    </div>
    
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" ngModel required email>
    </div>
    
    <div class="form-group">
      <label for="birthDate">Дата рождения</label>
      <input type="date" id="birthDate" name="birthDate" ngModel required>
    </div>

    <div class="form-group">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" ngModel required minlength="3">
    </div>
    
    <button type="submit" [disabled]="!registerForm.valid" class="btn-primary">
      Зарегистрироваться
    </button>
  </form>
</div>
